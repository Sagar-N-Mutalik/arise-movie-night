<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArISE 2026 — Movie Night | The National Institute of Engineering</title>
  <link rel="icon" type="image/png" href="/arise.png" />
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'brand-gold': '#e6ca65',
            'brand-navy': '#040711',
            'brand-card': '#0a101f',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    }
  </script>

  <!-- React 18, Babel, Confetti, QR Code, jsPDF & html2canvas -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      background-color: #040711;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .ticket-notch-left {
      position: absolute;
      left: -14px;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background-color: #040711;
      box-shadow: inset -2px 0 4px rgba(0, 0, 0, 0.7);
    }
    .ticket-notch-right {
      position: absolute;
      right: -14px;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background-color: #040711;
      box-shadow: inset 2px 0 4px rgba(0, 0, 0, 0.7);
    }
    @keyframes scanLaser {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }
    .scanner-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22c55e, #4ade80, #22c55e, transparent);
      box-shadow: 0 0 15px #22c55e, 0 0 8px #4ade80;
      animation: scanLaser 2.2s infinite ease-in-out;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #060913; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const NIE_EMAIL_REGEX = /^[\w\.-]+@nie\.ac\.in$/;

    // Database starting clean from 0
    function getStoredTickets() {
      try {
        const raw = localStorage.getItem('arise_tickets_v1');
        if (!raw) {
          localStorage.setItem('arise_tickets_v1', JSON.stringify([]));
          return [];
        }
        return JSON.parse(raw);
      } catch {
        return [];
      }
    }

    function saveStoredTicket(ticket) {
      const list = getStoredTickets();
      const idx = list.findIndex(t => t.ticketId === ticket.ticketId);
      if (idx >= 0) list[idx] = ticket;
      else list.unshift(ticket);
      localStorage.setItem('arise_tickets_v1', JSON.stringify(list));
      localStorage.setItem('arise_active_ticket_v1', JSON.stringify(ticket));
    }

    function getActiveStoredTicket() {
      try {
        const raw = localStorage.getItem('arise_active_ticket_v1');
        if (raw) return JSON.parse(raw);
        return null;
      } catch {
        return null;
      }
    }

    function clearAllDatabase() {
      localStorage.setItem('arise_tickets_v1', JSON.stringify([]));
      localStorage.removeItem('arise_active_ticket_v1');
    }

    // MAIN APP COMPONENT
    function App() {
      const [view, setView] = useState('landing'); // 'landing' | 'checkout' | 'ticket' | 'superadmin' | 'scanner'
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [verifiedStudent, setVerifiedStudent] = useState(null);
      const [activeTicket, setActiveTicket] = useState(getActiveStoredTicket());
      const [tickets, setTickets] = useState(getStoredTickets());

      // Read Direct Portal URL Query Parameters (?portal=superadmin or ?portal=scanner)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const portal = params.get('portal');
        const hash = window.location.hash;
        
        if (portal === 'superadmin' || hash === '#superadmin') {
          setView('superadmin');
        } else if (portal === 'scanner' || hash === '#scanner') {
          setView('scanner');
        }
      }, []);

      const refreshTickets = () => {
        setTickets(getStoredTickets());
        setActiveTicket(getActiveStoredTicket());
      };

      const handleVerified = (student) => {
        setVerifiedStudent(student);
        setView('checkout');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handlePaymentSuccess = (newTicket) => {
        saveStoredTicket(newTicket);
        setActiveTicket(newTicket);
        refreshTickets();
        setView('ticket');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-[#040711] text-slate-100 flex flex-col">
          
          {/* HEADER WITH 3 LOGOS: nie.jpeg (Left) & dept.jpeg, arise.png (Right) */}
          <header className="sticky top-0 z-40 w-full border-b border-white/5 bg-[#040711]/90 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
              
              {/* Left Logo: College (nie.jpeg) */}
              <div 
                onClick={() => setView('landing')}
                className="flex items-center gap-3.5 cursor-pointer group"
              >
                <div className="flex items-center">
                  <div className="w-14 h-14 rounded-full overflow-hidden flex items-center justify-center bg-white/0 border border-white/10">
                    <img 
                      src="/nie.jpeg" 
                      alt="The National Institute of Engineering" 
                      className="w-full h-full object-cover"
                      style={{ mixBlendMode: 'screen', filter: 'contrast(1.1) brightness(1.05)' }}
                      onError={(e) => { e.currentTarget.parentElement.style.display = 'none'; }}
                    />
                  </div>
                </div>
                <div className="flex flex-col">
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold tracking-wider text-base text-white">ArISE 2026</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/25">
                      NIE
                    </span>
                  </div>
                  <span className="text-[10px] tracking-widest text-slate-400 font-medium uppercase">
                    Department of ISE
                  </span>
                </div>
              </div>

              {/* Navigation Center */}
              <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="#details" className="hover:text-[#e6ca65] transition-colors">Event Details</a>
                <a href="#venue" className="hover:text-[#e6ca65] transition-colors">Venue</a>
                <a href="#guidelines" className="hover:text-[#e6ca65] transition-colors">Guidelines</a>
              </nav>

              {/* Right Side: Department Logo, ArISE Logo, Book Pass CTA */}
              <div className="flex items-center gap-3 sm:gap-4">
                
                {/* Pass pill removed per user request */}

                {/* Right Logos: Department (dept.jpeg) and ArISE (arise.png) — circular crop removes white bg */}
                <div className="flex items-center gap-2 sm:gap-3">
                  <div className="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center border border-white/10">
                    <img 
                      src="/dept.jpeg" 
                      alt="ISE Department Logo" 
                      className="w-full h-full object-cover"
                      style={{ mixBlendMode: 'screen', filter: 'contrast(1.1) brightness(1.05)' }}
                      onError={(e) => { e.currentTarget.parentElement.style.display = 'none'; }}
                    />
                  </div>
                  <div className="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center border border-white/10">
                    <img 
                      src="/arise.png" 
                      alt="ArISE Logo" 
                      className="w-full h-full object-cover"
                      style={{ mixBlendMode: 'screen', filter: 'contrast(1.1) brightness(1.05)' }}
                      onError={(e) => { e.currentTarget.parentElement.style.display = 'none'; }}
                    />
                  </div>
                </div>

                {/* Book Pass CTA */}
                <button
                  onClick={() => setIsAuthOpen(true)}
                  className="px-4 sm:px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-bold transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)] cursor-pointer"
                >
                  Book Pass
                </button>
              </div>

            </div>
          </header>

          {/* VIEW ROUTING */}
          {view === 'checkout' && verifiedStudent && (
            <CheckoutView
              student={verifiedStudent}
              onBack={() => setView('landing')}
              onSuccess={handlePaymentSuccess}
            />
          )}

          {view === 'ticket' && activeTicket && (
            <TicketView
              ticket={activeTicket}
              onReturnHome={() => setView('landing')}
              onOpenScanner={() => setView('scanner')}
            />
          )}

          {view === 'superadmin' && (
            <SuperAdminDashboard
              onClose={() => setView('landing')}
              tickets={tickets}
              onResetDatabase={() => {
                clearAllDatabase();
                refreshTickets();
              }}
              onTicketsChange={refreshTickets}
            />
          )}

          {view === 'scanner' && (
            <GateVolunteerScanner
              onClose={() => setView('landing')}
              tickets={tickets}
              onTicketsChange={refreshTickets}
            />
          )}

          {view === 'landing' && (
            <LandingPageView
              onBookPass={() => setIsAuthOpen(true)}
              totalRegistered={tickets.length}
            />
          )}

          {/* REDESIGNED STUDENT GATE AUTH MODAL */}
          <RedesignedStudentGateModal
            isOpen={isAuthOpen}
            onClose={() => setIsAuthOpen(false)}
            onVerified={handleVerified}
          />

        </div>
      );
    }

    // 1. REDESIGNED STUDENT GATE MODAL (EMOJI-FREE)
    function RedesignedStudentGateModal({ isOpen, onClose, onVerified }) {
      const [step, setStep] = useState('details');
      const [fullName, setFullName] = useState('');
      const [usn, setUsn] = useState('');
      const [branch, setBranch] = useState('ISE');
      const [mobile, setMobile] = useState('');
      const [email, setEmail] = useState('');
      const [emailTouched, setEmailTouched] = useState(false);
      const [isEmailValid, setIsEmailValid] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [otp, setOtp] = useState(['8','4','9','2','0','1']);
      const [sendingOtp, setSendingOtp] = useState(false);

      useEffect(() => {
        if (email.length > 0) {
          const valid = NIE_EMAIL_REGEX.test(email.trim().toLowerCase());
          setIsEmailValid(valid);
          if (!valid && emailTouched) {
            setErrorMsg('Please enter your official NIE institution email ending with @nie.ac.in');
          } else {
            setErrorMsg('');
          }
        }
      }, [email, emailTouched]);

      if (!isOpen) return null;

      const fillDemo = () => {
        setFullName('Sagar N Mutalik');
        setUsn('4NI23IS175');
        setBranch('ISE');
        setMobile('+91 98451 23456');
        setEmail('2023is_sagarmutalik_c@nie.ac.in');
        setEmailTouched(true);
        setIsEmailValid(true);
        setErrorMsg('');
      };

      const handleSubmitDetails = async (e) => {
        e.preventDefault();
        setEmailTouched(true);
        if (!fullName || !usn || !mobile || !isEmailValid) {
          setErrorMsg('Please complete all details with a valid @nie.ac.in email.');
          return;
        }

        setSendingOtp(true);
        try {
          // Attempt dispatch through real FastAPI backend if available
          await fetch('http://localhost:8000/api/auth/verify-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim().toLowerCase() })
          });
        } catch (err) {
          // Fallback to local dispatch
        } finally {
          setSendingOtp(false);
          setStep('otp');
        }
      };

      const handleConfirmOtp = () => {
        onVerified({
          fullName,
          usn: usn.toUpperCase(),
          branch,
          mobile,
          email: email.toLowerCase()
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
          
          <div className="relative w-full max-w-lg rounded-2xl bg-[#0a101f] border border-blue-500/25 shadow-2xl overflow-hidden">
            <div className="h-1.5 w-full bg-gradient-to-r from-amber-400 via-blue-500 to-indigo-600" />
            
            <button 
              onClick={onClose} 
              className="absolute top-5 right-5 text-slate-400 hover:text-white p-2 rounded-full hover:bg-white/5 transition-colors cursor-pointer text-sm"
            >
              Close
            </button>

            <div className="p-7 sm:p-9 space-y-5">
              
              <div>
                <span className="text-[10px] font-bold uppercase tracking-widest text-[#e6ca65] block">
                  ArISE 2026 Student Admission Gate
                </span>
                <h3 className="text-3xl font-serif font-bold text-white mt-1">
                  {step === 'details' ? 'Claim your moment.' : 'Verify your email.'}
                </h3>
                <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                  {step === 'details' 
                    ? 'Verify your official student identity. Strictly one pass per student.' 
                    : `We sent a 6-digit one-time access passcode to ${email}.`
                  }
                </p>
              </div>

              {step === 'details' && (
                <div className="flex items-center justify-between p-2.5 rounded-xl bg-blue-950/40 border border-blue-500/20 text-xs">
                  <span className="text-blue-300 font-medium">Quick student entry helper:</span>
                  <button 
                    type="button" 
                    onClick={fillDemo}
                    className="px-3 py-1 rounded-lg bg-blue-600/30 hover:bg-blue-600/50 text-blue-200 border border-blue-400/30 text-xs font-semibold cursor-pointer"
                  >
                    Auto-fill Student Info
                  </button>
                </div>
              )}

              {errorMsg && (
                <div className="p-3 rounded-xl bg-red-950/60 border border-red-500/30 text-red-200 text-xs">
                  {errorMsg}
                </div>
              )}

              {step === 'details' ? (
                <form onSubmit={handleSubmitDetails} className="space-y-4 text-xs">
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1.5 uppercase tracking-wider text-[10px]">
                        Full Name
                      </label>
                      <input 
                        type="text" 
                        required 
                        value={fullName} 
                        onChange={e => setFullName(e.target.value)}
                        placeholder="e.g. Sagar N Mutalik"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white placeholder-slate-500 outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1.5 uppercase tracking-wider text-[10px]">
                        USN
                      </label>
                      <input 
                        type="text" 
                        required 
                        value={usn} 
                        onChange={e => setUsn(e.target.value.toUpperCase())}
                        placeholder="e.g. 4NI23IS175"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white uppercase placeholder-slate-500 outline-none focus:border-blue-500 font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1.5 uppercase tracking-wider text-[10px]">
                        Mobile Number
                      </label>
                      <input 
                        type="tel" 
                        required 
                        value={mobile} 
                        onChange={e => setMobile(e.target.value)}
                        placeholder="+91 98451 23456"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white placeholder-slate-500 outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1.5 uppercase tracking-wider text-[10px]">
                        Branch
                      </label>
                      <select 
                        value={branch} 
                        onChange={e => setBranch(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white outline-none cursor-pointer focus:border-blue-500"
                      >
                        <option value="ISE">Information Science (ISE)</option>
                        <option value="CSE">Computer Science (CSE)</option>
                        <option value="AIML">AI & Machine Learning (AIML)</option>
                        <option value="AIDS">AI & Data Science (AIDS)</option>
                        <option value="ECE">Electronics & Communication (ECE)</option>
                        <option value="EEE">Electrical & Electronics (EEE)</option>
                        <option value="MECH">Mechanical Engineering (MECH)</option>
                        <option value="CIVIL">Civil Engineering (CIVIL)</option>
                      </select>
                    </div>
                  </div>

                  {/* Field Label: "Your NIE mail ID" with NO technical regex text below */}
                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-slate-300 font-semibold uppercase tracking-wider text-[10px]">
                        Your NIE mail ID
                      </label>
                      {email && isEmailValid && (
                        <span className="text-[10px] text-emerald-400 font-semibold font-mono">
                          Verified NIE Domain
                        </span>
                      )}
                    </div>
                    <input 
                      type="email" 
                      required 
                      value={email}
                      onBlur={() => setEmailTouched(true)}
                      onChange={e => { setEmail(e.target.value); setEmailTouched(true); }}
                      placeholder="name@nie.ac.in"
                      className={`w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border text-white placeholder-slate-500 outline-none transition-all ${
                        emailTouched && !isEmailValid ? 'border-red-500' : isEmailValid ? 'border-emerald-500/80' : 'border-slate-700/80'
                      }`}
                    />
                  </div>

                  <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 text-[11px] text-slate-400">
                    <span className="font-semibold text-slate-300">Admission Rule:</span> Exactly 1 non-transferable student pass per verified USN.
                  </div>

                  <button
                    type="submit"
                    disabled={!isEmailValid || sendingOtp}
                    className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg transition-all cursor-pointer"
                  >
                    {sendingOtp ? 'Sending verification code...' : 'Send verification code'}
                  </button>
                </form>
              ) : (
                <div className="space-y-5">
                  <div className="flex justify-center gap-2 sm:gap-3 py-2">
                    {otp.map((digit, idx) => (
                      <input
                        key={idx}
                        type="text"
                        maxLength={1}
                        value={digit}
                        onChange={e => {
                          const next = [...otp];
                          next[idx] = e.target.value.slice(-1);
                          setOtp(next);
                        }}
                        className="w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold font-mono rounded-xl bg-slate-900 border border-slate-700 text-[#e6ca65] outline-none focus:border-amber-400"
                      />
                    ))}
                  </div>

                  <div className="flex justify-between items-center text-xs text-slate-400">
                    <span 
                      className="text-[#e6ca65] hover:underline cursor-pointer" 
                      onClick={() => setOtp(['8','4','9','2','0','1'])}
                    >
                      Demo code: 849201
                    </span>
                    <span>Resend code in 24s</span>
                  </div>

                  <button
                    onClick={handleConfirmOtp}
                    className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider shadow-lg cursor-pointer"
                  >
                    Verify Identity & Proceed to Checkout
                  </button>

                  <button
                    type="button"
                    onClick={() => setStep('details')}
                    className="w-full text-center text-xs text-slate-400 hover:text-white"
                  >
                    Edit student information
                  </button>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    // 2. CHECKOUT VIEW (EMOJI-FREE)
    function CheckoutView({ student, onBack, onSuccess }) {
      const [processing, setProcessing] = useState(false);

      const triggerPayment = () => {
        setProcessing(true);
        setTimeout(() => {
          setProcessing(false);
          const seq = Math.floor(100000 + Math.random() * 900000);
          const ticketId = `NIE26-000001`;
          const newTicket = {
            ticketId,
            bookingId: `BK-${seq}`,
            fullName: student.fullName,
            usn: student.usn,
            branch: student.branch,
            email: student.email,
            mobile: student.mobile,
            eventName: 'ArISE 2026 Movie Night',
            eventDate: '18 Nov 2026 · 6:00 PM IST',
            venue: 'Diamond Jubilee Complex · South Campus, NIE Mysuru',
            amount: 149,
            qrPayload: `${ticketId}-SEC-${Math.random().toString(16).substring(2, 8).toUpperCase()}`,
            status: 'CONFIRMED',
            issuedAt: new Date().toISOString()
          };
          onSuccess(newTicket);
        }, 750);
      };

      return (
        <div className="py-12 px-4 max-w-5xl mx-auto flex-1">
          <button onClick={onBack} className="text-xs text-slate-400 hover:text-white mb-6 cursor-pointer">Back to details</button>
          
          <span className="text-[11px] font-bold uppercase tracking-widest text-[#e6ca65] block">Final Transmission</span>
          <h1 className="text-4xl sm:text-5xl font-serif text-white tracking-tight mt-1">
            Confirm your <span className="italic text-[#e6ca65]">pass.</span>
          </h1>
          <p className="text-xs text-slate-400 mt-2 mb-8">
            Your identity is verified. Review details before completing payment.
          </p>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-7 space-y-4">
              <div className="p-6 rounded-2xl bg-[#0c1424] border border-slate-700/60 shadow-xl flex items-center justify-between">
                <div>
                  <h3 className="text-lg font-bold text-white">{student.fullName}</h3>
                  <div className="text-xs text-slate-400 font-mono">{student.usn} · {student.branch}</div>
                  <div className="text-xs text-slate-300 font-mono mt-0.5">{student.email}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{student.mobile}</div>

    // 5. GATE VOLUNTEER SCANNER (DIRECT LINK: ?portal=scanner, HIDES ALL MONEY/REVENUE)
    function GateVolunteerScanner({ onClose, tickets, onTicketsChange }) {
      const [scanInput, setScanInput] = useState('');
      const [scanResult, setScanResult] = useState(null);

      const totalEntered = tickets.filter(t => t.status === 'USED').length;

      const performScan = (query) => {
        if (!query) return;
        const clean = query.trim().toLowerCase();
        const list = [...tickets];
        const idx = list.findIndex(t => 
          t.ticketId.toLowerCase() === clean || 
          t.qrPayload.toLowerCase() === clean ||
          t.usn.toLowerCase() === clean
        );

        if (idx === -1) {
          setScanResult({
            status: 'INVALID',
            msg: `Security Alert: Token "${query}" not recognized in system. Entry denied.`,
          });
          return;
        }

        const t = list[idx];
        if (t.status === 'USED') {
          setScanResult({
            status: 'ALREADY_USED',
            msg: `DUPLICATE ENTRY ALERT! Ticket ${t.ticketId} was ALREADY scanned earlier. Entry denied.`,
            ticket: t
          });
          return;
        }

        // Mark USED
        const updated = { ...t, status: 'USED', scannedAt: new Date().toISOString(), scannedBy: 'Gate Volunteer 01' };
        list[idx] = updated;
        localStorage.setItem('arise_tickets_v1', JSON.stringify(list));
        onTicketsChange();

        setScanResult({
          status: 'VALID',
          msg: `ENTRY APPROVED: Welcome ${t.fullName}! Pass verified.`,
          ticket: updated
        });
      };

      return (
        <div className="py-8 px-4 max-w-5xl mx-auto flex-1 space-y-6 animate-in fade-in">
          
          <div className="flex justify-between items-center pb-4 border-b border-white/10">

              Admitted: <span className="font-mono font-bold text-white">{totalEntered}</span> Attendees

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                    ALIGN STUDENT QR HERE
                  </div>

                    DIAMOND JUBILEE GATE
                  </div>
                </div>
              </div>

              <div className="p-4 rounded-xl bg-[#0a101f] border border-slate-800 space-y-3">
                <label className="text-[10px] uppercase font-semibold text-slate-400 block">
                  Scan Input / Barcode Scanner Gun / USN
                </label>
                <div className="flex gap-2">
                  <input

                    placeholder="Enter Ticket ID (e.g. NIE26-000001) or USN"

    // 7. COUNTDOWN COMPONENT (EMOJI-FREE)
    function CountdownTimer() {
      const [timeLeft, setTimeLeft] = useState({ days: 6, hours: 3, minutes: 8, seconds: 27 });

      useEffect(() => {
        const target = new Date('2026-11-18T18:00:00+05:30').getTime();
        const interval = setInterval(() => {
          const now = new Date().getTime();
          const diff = target - now;
          if (diff <= 0) return;
          setTimeLeft({
            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
            hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
            minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
            seconds: Math.floor((diff % (1000 * 60)) / 1000)
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const fmt = (n) => String(n).padStart(2, '0');

      return (
        <div className="w-full border-y border-white/5 bg-[#090e1a]/60 backdrop-blur-md py-10 px-4">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
            <div>
              <span className="text-xs uppercase tracking-widest text-[#e6ca65] font-semibold block mb-2">The Countdown Is On</span>
              <h2 className="text-3xl md:text-4xl font-serif text-white tracking-tight">Lights down. Stories up.</h2>
            </div>
            <div className="grid grid-cols-4 gap-3 sm:gap-6">
              {[
                { label: 'Days', val: timeLeft.days },
                { label: 'Hours', val: timeLeft.hours },
                { label: 'Minutes', val: timeLeft.minutes },
                { label: 'Seconds', val: timeLeft.seconds }
              ].map((item, i) => (
                <div key={i} className="flex flex-col items-center">
                  <div className="w-16 sm:w-20 h-16 sm:h-20 rounded-xl bg-slate-900/80 border border-amber-500/20 flex items-center justify-center shadow-lg">
                    <span className="text-2xl sm:text-3xl font-mono font-bold text-[#e6ca65]">{fmt(item.val)}</span>
                  </div>
                  <span className="text-[10px] sm:text-xs uppercase tracking-widest text-slate-400 mt-2 font-medium">{item.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
